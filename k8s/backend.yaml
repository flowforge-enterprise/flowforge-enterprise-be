apiVersion: v1
kind: Secret
metadata:
  name: flowforge-backend-secret
  namespace: flowforge
type: Opaque
stringData:
  MYSQL_USER: workflow
  MYSQL_PASSWORD: workflow
  APP_JWT_SECRET: workflow-mvp-demo-secret-key-change-before-production-123456

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowforge-backend
  namespace: flowforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flowforge-backend
  template:
    metadata:
      labels:
        app: flowforge-backend
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: backend
          image: crpi-vu83mjrcrc7gnl5w.cn-hangzhou.personal.cr.aliyuncs.com/nus_flowforge/flowforge-enterprise-be:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: mysql
            - name: MYSQL_URL
              value: jdbc:mysql://flowforge-mysql:3306/workflow_mvp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: flowforge-backend-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flowforge-backend-secret
                  key: MYSQL_PASSWORD
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: flowforge-backend-secret
                  key: APP_JWT_SECRET

---
apiVersion: v1
kind: Service
metadata:
  name: flowforge-backend
  namespace: flowforge
spec:
  type: LoadBalancer
  selector:
    app: flowforge-backend
  ports:
    - port: 80
      targetPort: 8080