controller:
  image:
    registry: docker.m.daocloud.io
    repository: jenkins/jenkins
    tag: 2.555.1-jdk21
    pullPolicy: IfNotPresent

  nodeSelector:
    workload: nonprod

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  initContainerEnv:
    - name: JENKINS_UC
      value: https://mirrors.tuna.tsinghua.edu.cn/jenkins/updates/current/update-center.json
    - name: JENKINS_UC_DOWNLOAD
      value: https://mirrors.tuna.tsinghua.edu.cn/jenkins
    - name: JENKINS_PLUGIN_INFO
      value: https://mirrors.tuna.tsinghua.edu.cn/jenkins/updates/current/plugin-versions.json

  # Reuse plugins restored from the existing Jenkins home volume.
  initializeOnce: true
  installPlugins: false

  # Public access is provided by the existing jenkins-public LoadBalancer service.
  serviceType: ClusterIP
  jenkinsUrl: http://47.96.133.39:8080

  # Jenkins Controller 不执行普通构建任务
  numExecutors: 0

  JCasC:
    defaultConfig: true

  additionalPlugins: []

  sidecars:
    configAutoReload:
      image:
        registry: docker.m.daocloud.io
        repository: kiwigrid/k8s-sidecar
        tag: 2.8.1

persistence:
  enabled: true
  existingClaim: jenkins-pvc

rbac:
  create: true

serviceAccount:
  create: false
  name: jenkins

agent:
  enabled: true
  image:
    registry: docker.m.daocloud.io
    repository: jenkins/inbound-agent
    tag: 3384.v60d89463d9e0-1
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
