apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
  annotations:
    checkov.io/skip1: "CKV_K8S_22=Jenkins requires write access to JENKINS_HOME"
    checkov.io/skip2: "CKV_K8S_23=Jenkins runs as root to manage Docker build agents"
    checkov.io/skip3: "CKV_K8S_27=Jenkins requires Docker socket to run container build agents"
    checkov.io/skip4: "CKV_K8S_38=Jenkins service account token required for Kubernetes API access"
    checkov.io/skip5: "CKV_K8S_40=Jenkins runs as root (UID 0) which is required to manage build agents"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jenkins
          image: crpi-vu83mjrcrc7gnl5w.cn-hangzhou.personal.cr.aliyuncs.com/nus_flowforge/jenkins:lts
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: web
            - containerPort: 50000
              name: agent
          env:
            - name: JAVA_OPTS
              value: "-Djenkins.install.runSetupWizard=false"
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            - name: docker-sock
              mountPath: /var/run/docker.sock
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
                - NET_RAW
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: jenkins-pvc
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
