skip-check:
  # Secrets referenced via secretKeyRef in env vars — standard and secure Spring Boot pattern.
  # Mounting every secret as a file would require a projected volume per secret, which adds
  # no practical security benefit when the pod already has least-privilege RBAC.
  - CKV_K8S_35
  # NetworkPolicy enforcement is a cluster-level concern managed outside individual service
  # manifests; adding per-pod NetworkPolicy stubs here would be incomplete and misleading.
  - CKV2_K8S_6
  # Image digest pinning is impractical in CI/CD pipelines where the image tag is updated
  # on every build; digest verification is handled at the registry admission level instead.
  - CKV_K8S_43

