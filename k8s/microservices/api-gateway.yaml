apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: flowforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: api-gateway
          image: crpi-vu83mjrcrc7gnl5w.cn-hangzhou.personal.cr.aliyuncs.com/nus_flowforge/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: flowforge-shared-secret
                  key: APP_JWT_SECRET
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8081
            - name: WORKFLOW_SERVICE_URL
              value: http://workflow-service:8082
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-audit-service:8083
            - name: AI_SERVICE_URL
              value: http://ai-assistant-service:8084
            - name: ATTACHMENT_SERVICE_URL
              value: http://attachment-service:8085
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: flowforge
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
