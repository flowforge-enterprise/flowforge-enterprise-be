apiVersion: v1
kind: Secret
metadata:
  name: flowforge-shared-secret
  namespace: flowforge
type: Opaque
stringData:
  # REQUIRED — fill in real values and apply with:
  #   kubectl apply -f k8s/shared-secret.yaml
  # Do NOT commit real values to the repo.
  APP_JWT_SECRET: "REPLACE_ME"
  INTERNAL_API_KEY: "REPLACE_ME"
  DEFAULT_PASSWORD: "REPLACE_ME"
