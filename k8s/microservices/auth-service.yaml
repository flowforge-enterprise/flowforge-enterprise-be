apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: flowforge
type: Opaque
stringData:
  DB_PASSWORD: auth_password
  # APP_JWT_SECRET: <set in cluster, do NOT commit real secret>
  # INTERNAL_API_KEY: <set in cluster>
  # DEFAULT_PASSWORD: <set in cluster>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: flowforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: auth-service
          image: crpi-vu83mjrcrc7gnl5w.cn-hangzhou.personal.cr.aliyuncs.com/nus_flowforge/auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: DB_URL
              value: jdbc:mysql://flowforge-mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
            - name: DB_USER
              value: auth_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: DB_PASSWORD
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: flowforge-shared-secret
                  key: APP_JWT_SECRET
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flowforge-shared-secret
                  key: INTERNAL_API_KEY
            - name: DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flowforge-shared-secret
                  key: DEFAULT_PASSWORD
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-audit-service:8083
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: flowforge
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
