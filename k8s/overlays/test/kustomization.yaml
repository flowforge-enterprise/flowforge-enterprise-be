apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flowforge-test

resources:
  - namespace.yaml
  - ../../base

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          workload: nonprod
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          workload: nonprod
