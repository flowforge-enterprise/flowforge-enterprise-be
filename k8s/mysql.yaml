apiVersion: v1
kind: Secret
metadata:
  name: flowforge-mysql-secret
  namespace: flowforge
type: Opaque
stringData:
  MYSQL_DATABASE: workflow_mvp
  MYSQL_USER: workflow
  MYSQL_PASSWORD: workflow
  MYSQL_ROOT_PASSWORD: root

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flowforge-mysql-pvc
  namespace: flowforge
spec:
  storageClassName: alicloud-disk-essd
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowforge-mysql
  namespace: flowforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flowforge-mysql
  template:
    metadata:
      labels:
        app: flowforge-mysql
    spec:
      containers:
        - name: mysql
          image: crpi-vu83mjrcrc7gnl5w.cn-hangzhou.personal.cr.aliyuncs.com/nus_flowforge/mysql:8.4
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: flowforge-mysql-secret
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: flowforge-mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: flowforge-mysql
  namespace: flowforge
spec:
  type: ClusterIP
  selector:
    app: flowforge-mysql
  ports:
    - port: 3306
      targetPort: 3306