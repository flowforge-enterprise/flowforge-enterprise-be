name: Microservices CI with SNYK

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  setup-build:
    name: Setup & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: microservices/pom.xml

      - name: Build all services (skip tests)
        run: mvn --batch-mode clean verify -DskipTests

      - name: Validate Docker Compose config
        env:
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
        run: docker compose config --quiet

  lint-check:
    name: Lint Check (Checkstyle)
    runs-on: ubuntu-latest
    needs: setup-build
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Checkstyle Lint
        run: mvn --batch-mode checkstyle:checkstyle || true

      - name: Upload Checkstyle Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-reports
          path: microservices/**/target/site/checkstyle.html

  snyk-sca:
    name: Snyk SCA Scan
    runs-on: ubuntu-latest
    needs: lint-check
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (for Snyk CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk SCA scan
        run: snyk test --all-projects --severity-threshold=high
        continue-on-error: true

  snyk-sast:
    name: Snyk SAST Scan
    runs-on: ubuntu-latest
    needs: lint-check
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (for Snyk CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk Code (SAST) scan
        run: snyk code test --severity-threshold=high

      - name: Monitor project in Snyk
        run: snyk monitor --all-projects

  test-and-coverage:
    name: Run Unit Tests & Upload Coverage
    runs-on: ubuntu-latest
    needs: [snyk-sca, snyk-sast]
    env:
      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: microservices/pom.xml

      - name: Run tests and generate JaCoCo XML reports
        run: mvn --batch-mode clean verify

      - name: Upload Test Results & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            microservices/**/target/surefire-reports/
            microservices/**/target/site/jacoco/

      - name: Set up JDK 21 for SonarQube Cloud
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: SonarQube Scan
        run: |
          mvn --batch-mode sonar:sonar \
            -Dsonar.projectKey=flowforge-enterprise-be \
            -Dsonar.organization=flowforge-enterprise \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

  dast-scan:
    name: DAST Security Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: test-and-coverage
    env:
      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
      GATEWAY_PORT: "8080"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start all services via Docker Compose
        working-directory: microservices
        run: |
          docker compose up -d
          echo "Waiting 30s for services to initialise..."
          sleep 30

      - name: Wait for api-gateway to be ready
        run: |
          MAX_ATTEMPTS=24
          ATTEMPT=0
          SUCCESS=false

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo ""
            echo "[$ATTEMPT/$MAX_ATTEMPTS] Checking api-gateway..."

            if docker compose -f microservices/docker-compose.yml ps api-gateway | grep -q "Exit\|exited"; then
              echo "api-gateway container has exited!"
              docker compose -f microservices/docker-compose.yml logs api-gateway --tail=50
              exit 1
            fi

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$GATEWAY_PORT 2>/dev/null || echo "000")
            echo "HTTP status: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "404" ]; then
              echo "api-gateway is ready!"
              SUCCESS=true
              break
            fi

            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "api-gateway failed to become ready within expected time"
              docker compose -f microservices/docker-compose.yml logs --tail=50
              exit 1
            fi

            sleep 5
          done

      - name: Create ZAP rules configuration
        run: |
          mkdir -p .zap
          cat > .zap/rules.tsv << 'EOF'
          # ZAP Scanning Rules - Relaxed Mode
          10028	WARN	# Open Redirect
          10029	WARN	# Cookie Poisoning
          10033	WARN	# Directory Browsing
          10043	WARN	# User Controllable JavaScript Event (XSS)
          10045	WARN	# Source Code Disclosure - /WEB-INF folder
          10046	WARN	# Insecure HTTP Method
          10048	WARN	# Remote Code Execution - Shell Shock
          10062	WARN	# PII Disclosure
          10099	WARN	# Source Code Disclosure
          10105	WARN	# Weak Authentication Method
          10021	INFO	# X-Content-Type-Options header missing
          10023	INFO	# Information Disclosure - Debug Error Messages
          10025	INFO	# Information Disclosure - Sensitive Information in URL
          10027	INFO	# Information Disclosure - Suspicious Comments
          10031	INFO	# User Controllable Charset
          10032	INFO	# Viewstate Scanner
          10034	INFO	# Cloud Metadata Potentially Exposed
          10035	INFO	# Strict-Transport-Security Header Not Set
          10036	INFO	# HTTP Server Response Header
          10037	INFO	# Server Leaks Information via "X-Powered-By"
          10038	INFO	# Content Security Policy (CSP) Header Not Set
          10039	INFO	# X-Backend-Server Header Information Leak
          10040	INFO	# Secure Pages Include Mixed Content
          10041	INFO	# HTTP to HTTPS Insecure Transition in Form Post
          10042	INFO	# HTTPS to HTTP Insecure Transition in Form Post
          10044	INFO	# Big Redirect Detected
          10047	INFO	# HTTPS Content Available via HTTP
          10049	INFO	# Content Cacheability
          10050	INFO	# Retrieved from Cache
          10051	INFO	# Relative Path Confusion
          10052	INFO	# X-ChromeLogger-Data (XCOLD) Header Information Leak
          10054	INFO	# Cookie without SameSite Attribute
          10055	INFO	# CSP Scanner
          10056	INFO	# X-Debug-Token Information Leak
          10057	INFO	# Username Hash Found
          10061	INFO	# X-AspNet-Version Response Header
          10063	INFO	# Permissions Policy Header Not Set
          10096	INFO	# Timestamp Disclosure
          10097	INFO	# Hash Disclosure
          10098	INFO	# Cross-Domain Misconfiguration
          10106	INFO	# HTTP Only Site
          10107	INFO	# Httpoxy - Proxy Header Misuse
          10108	INFO	# Reverse Tabnabbing
          10109	INFO	# Modern Web Application
          10110	INFO	# Dangerous JS Functions
          EOF

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: "http://localhost:${{ env.GATEWAY_PORT }}"
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -I'
          fail_action: false
          allow_issue_writing: false
        continue-on-error: true
        timeout-minutes: 10

      - name: OWASP ZAP Full Scan (API endpoints)
        uses: zaproxy/action-full-scan@v0.8.0
        with:
          target: "http://localhost:${{ env.GATEWAY_PORT }}"
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -m 5'
          fail_action: false
          allow_issue_writing: false
        continue-on-error: true
        timeout-minutes: 15
        if: success() || failure()

      - name: Stop all services
        if: always()
        working-directory: microservices
        run: docker compose down -v

      - name: Upload ZAP scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-reports
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: warn
          retention-days: 30

      - name: Generate DAST Summary
        if: always()
        run: |
          echo "# DAST Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## OWASP ZAP Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Target: http://localhost:${{ env.GATEWAY_PORT }} (api-gateway)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f report_md.md ]; then
            cat report_md.md >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No ZAP report generated" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 Full reports are available in the artifacts section" >> $GITHUB_STEP_SUMMARY

  stress-test:
    name: Stress Test with k6
    runs-on: ubuntu-latest
    needs: dast-scan
    env:
      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
      GATEWAY_PORT: "8080"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start all services via Docker Compose
        working-directory: microservices
        run: |
          docker compose up -d
          sleep 30

      - name: Wait for api-gateway
        run: |
          for i in {1..24}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${GATEWAY_PORT} || echo "000")
            echo "[$i/24] HTTP_CODE=$HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "404" ]; then
              echo "api-gateway is ready"
              exit 0
            fi
            sleep 5
          done

          echo "api-gateway did not become ready"
          docker compose -f microservices/docker-compose.yml logs --tail=50
          exit 1

      - name: Run k6 stress test
        run: |
          docker run --rm \
            --network host \
            -v "$PWD/stress-test:/scripts" \
            grafana/k6 run /scripts/stress-test.js

      - name: Stop all services
        if: always()
        working-directory: microservices
        run: docker compose down -v

      - name: Upload stress test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-stress-test-results
          path: stress-test/

  trigger-jenkins-cd:
    name: Trigger Jenkins CD
    runs-on: ubuntu-latest
    needs: [stress-test]
    if: github.ref == 'refs/heads/master' && success()

    steps:
      - name: Trigger Jenkins deployment
        run: |
          curl -X POST \
          -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
          "${{ secrets.JENKINS_URL }}/job/flowforge-enterprise-be-pipeline/build?token=${{ secrets.JENKINS_JOB_TOKEN }}"
