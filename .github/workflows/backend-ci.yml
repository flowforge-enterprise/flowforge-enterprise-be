name: Microservices CI

on:
  push:
    branches: ["master"]
    paths:
      - "microservices/**"
      - "k8s/**"
      - "Jenkinsfile"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "microservices/**"
      - "k8s/**"
      - "Jenkinsfile"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:
    inputs:
      run_stress:
        description: "Run k6 stress test"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  detect-changes:
    name: Changes | Detect affected services
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      run_compose_checks: ${{ steps.detect.outputs.run_compose_checks }}
      run_iac_checks: ${{ steps.detect.outputs.run_iac_checks }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected Maven modules
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          SERVICES=(
            auth-service
            workflow-service
            notification-audit-service
            ai-assistant-service
            attachment-service
            api-gateway
            platform-security
          )

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          git diff --name-only "$BASE_SHA" HEAD > /tmp/changed-files.txt
          cat /tmp/changed-files.txt

          declare -A SELECTED=()
          COMMON_CHANGED=false
          SECURITY_CHANGED=false
          COMPOSE_CHANGED=false
          IAC_CHANGED=false

          while IFS= read -r FILE_PATH; do
            case "$FILE_PATH" in
              microservices/pom.xml|microservices/Dockerfile|.github/workflows/backend-ci.yml)
                COMMON_CHANGED=true
                ;;
              microservices/platform-security/*)
                SECURITY_CHANGED=true
                ;;
              microservices/docker-compose.yml)
                COMPOSE_CHANGED=true
                ;;
              k8s/*|k8s/**|Jenkinsfile)
                IAC_CHANGED=true
                ;;
            esac

            for SERVICE in "${SERVICES[@]}"; do
              if [[ "$FILE_PATH" == "microservices/$SERVICE/"* ]]; then
                SELECTED["$SERVICE"]=1
              fi
            done
          done < /tmp/changed-files.txt

          if [ "$COMMON_CHANGED" = true ]; then
            for SERVICE in "${SERVICES[@]}"; do
              SELECTED["$SERVICE"]=1
            done
          fi

          if [ "$SECURITY_CHANGED" = true ]; then
            for SERVICE in auth-service workflow-service notification-audit-service ai-assistant-service attachment-service; do
              SELECTED["$SERVICE"]=1
            done
          fi

          MODULES=()
          for SERVICE in "${SERVICES[@]}"; do
            if [ "${SELECTED[$SERVICE]+set}" = "set" ]; then
              MODULES+=("$SERVICE")
            fi
          done

          if [ "${#MODULES[@]}" -eq 0 ]; then
            echo 'modules=[]' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          else
            JSON="["
            for MODULE in "${MODULES[@]}"; do
              JSON="${JSON}\"${MODULE}\","
            done
            JSON="${JSON%,}]"
            echo "modules=$JSON" >> "$GITHUB_OUTPUT"
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          fi

          if [ "$COMPOSE_CHANGED" = true ] || [ "$COMMON_CHANGED" = true ]; then
            echo 'run_compose_checks=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_compose_checks=false' >> "$GITHUB_OUTPUT"
          fi

          if [ "$IAC_CHANGED" = true ] || [ "$COMMON_CHANGED" = true ]; then
            echo 'run_iac_checks=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_iac_checks=false' >> "$GITHUB_OUTPUT"
          fi

  validate-compose:
    name: Validation | Docker Compose
    runs-on: ubuntu-latest
    needs: [detect-changes, build-test]
    if: |
      always() &&
      needs.detect-changes.outputs.run_compose_checks == 'true' &&
      needs.build-test.result != 'failure' &&
      needs.build-test.result != 'cancelled'
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        env:
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
        run: docker compose config --quiet

  integration-container-evidence:
    name: Test | Integration and container evidence
    runs-on: ubuntu-latest
    needs: [detect-changes, trivy-image-scan, validate-compose]
    if: |
      always() &&
      needs.detect-changes.outputs.has_changes == 'true' &&
      needs.trivy-image-scan.result != 'failure' &&
      needs.trivy-image-scan.result != 'cancelled' &&
      needs.validate-compose.result != 'failure' &&
      needs.validate-compose.result != 'cancelled'
    env:
      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
      GATEWAY_PORT: "8080"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start services for integration testing
        working-directory: microservices
        run: |
          docker compose up -d --build

      - name: Run integration smoke tests
        run: |
          set -euo pipefail
          mkdir -p evidence/integration evidence/container-inspection evidence/container-logs

          {
            echo "# Integration Smoke Test Evidence"
            echo
            echo "- Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Timestamp UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
          } > evidence/integration/smoke-test.md

          curl_code() {
            local url="$1"
            local body_path="$2"
            local code
            code="$(curl -s -o "$body_path" -w "%{http_code}" "$url" 2>/dev/null || true)"
            printf "%s" "${code:-000}"
          }

          check_http_once() {
            local name="$1"
            local url="$2"
            local expected_codes="$3"
            local code

            code="$(curl_code "$url" "evidence/integration/${name}.body")"
            echo "| ${name} | ${url} | ${code} | ${expected_codes} |" >> evidence/integration/smoke-test.md
            if [[ ",${expected_codes}," != *",${code},"* ]]; then
              echo "Unexpected HTTP code for ${name}: ${code}; expected one of ${expected_codes}" >&2
              return 1
            fi
          }

          wait_http() {
            local name="$1"
            local url="$2"
            local expected_codes="$3"
            local code

            for i in {1..48}; do
              code="$(curl_code "$url" "evidence/integration/${name}.body")"
              echo "[$i/48] ${name} HTTP_CODE=$code"
              if [[ ",${expected_codes}," == *",${code},"* ]]; then
                echo "| ${name} | ${url} | ${code} | ${expected_codes} |" >> evidence/integration/smoke-test.md
                return 0
              fi
              sleep 5
            done

            echo "| ${name} | ${url} | ${code} | ${expected_codes} |" >> evidence/integration/smoke-test.md
            echo "Unexpected HTTP code for ${name}: ${code}; expected one of ${expected_codes}" >&2
            docker compose -f microservices/docker-compose.yml ps
            docker compose -f microservices/docker-compose.yml logs --tail=120
            return 1
          }

          for i in {1..48}; do
            code="$(curl_code "http://localhost:${GATEWAY_PORT}/actuator/health" /tmp/api-gateway-health.body)"
            echo "[$i/48] api-gateway /actuator/health HTTP_CODE=$code"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 5
          done

          {
            echo "| Check | URL | HTTP code | Expected |"
            echo "|---|---|---:|---|"
          } >> evidence/integration/smoke-test.md

          wait_http "api-gateway-health" "http://localhost:${GATEWAY_PORT}/actuator/health" "200"
          wait_http "auth-health" "http://localhost:8081/actuator/health" "200"
          wait_http "workflow-health" "http://localhost:8082/actuator/health" "200"
          wait_http "notification-health" "http://localhost:8083/actuator/health" "200"
          wait_http "ai-assistant-health" "http://localhost:8084/actuator/health" "200"
          wait_http "attachment-health" "http://localhost:8085/actuator/health" "200"

      - name: Collect container inspection evidence
        if: always()
        run: |
          mkdir -p evidence/container-inspection evidence/container-logs
          docker compose -f microservices/docker-compose.yml ps --all > evidence/container-inspection/docker-compose-ps.txt || true
          docker compose -f microservices/docker-compose.yml config --no-interpolate > evidence/container-inspection/docker-compose-config.yml || true
          docker images > evidence/container-inspection/docker-images.txt || true
          docker network ls > evidence/container-inspection/docker-networks.txt || true
          docker volume ls > evidence/container-inspection/docker-volumes.txt || true
          ids="$(docker compose -f microservices/docker-compose.yml ps -q || true)"
          if [ -n "$ids" ]; then
            docker inspect $ids | jq '
              map(
                .Config.Env = ["REDACTED"] |
                .NetworkSettings.Networks |= with_entries(.value.IPAddress = "REDACTED")
              )
            ' > evidence/container-inspection/docker-inspect.json || true
          else
            echo "No docker compose containers found." > evidence/container-inspection/docker-inspect.json
          fi

      - name: Collect container logs
        if: always()
        run: |
          mkdir -p evidence/container-logs
          docker compose -f microservices/docker-compose.yml logs --no-color > evidence/container-logs/docker-compose.log || true

      - name: Stop integration services
        if: always()
        working-directory: microservices
        run: docker compose down -v

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-container-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

  iac-scan:
    name: Security | Checkov IaC scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.run_iac_checks == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Checkov
        run: python3 -m pip install --user checkov

      # Checkov is evidence-only for now; remove --soft-fail / || true later
      # if you want IaC policy violations to block the pipeline.
      - name: Scan Kubernetes manifests with Checkov
        run: |
          mkdir -p evidence/iac
          CHECKOV_BIN="$(python3 -m site --user-base)/bin/checkov"
          "$CHECKOV_BIN" \
            --directory k8s \
            --framework kubernetes \
            --output json \
            --soft-fail \
            > evidence/iac/checkov-kubernetes.json \
            2> evidence/iac/checkov-stderr.log || true

      - name: Upload Checkov evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac-checkov-results
          path: evidence/iac/
          if-no-files-found: warn
          retention-days: 30

  build-test:
    name: Test | Build and unit test (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-check, sonar, snyk-sca, snyk-sast, iac-scan]
    if: |
      always() &&
      needs.detect-changes.outputs.has_changes == 'true' &&
      needs.lint-check.result != 'failure' &&
      needs.lint-check.result != 'cancelled' &&
      needs.snyk-sca.result != 'failure' &&
      needs.snyk-sca.result != 'cancelled' &&
      needs.snyk-sast.result != 'failure' &&
      needs.snyk-sast.result != 'cancelled' &&
      needs.iac-scan.result != 'failure' &&
      needs.iac-scan.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: microservices/pom.xml

      - name: Build and test service
        run: mvn --batch-mode -ntp -pl "${{ matrix.module }}" -am clean verify

      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.module }}
          path: |
            microservices/${{ matrix.module }}/target/surefire-reports/
            microservices/${{ matrix.module }}/target/site/jacoco/

  lint-check:
    name: Quality | Checkstyle (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: microservices/pom.xml

      - name: Run Checkstyle
        run: mvn --batch-mode -ntp -pl "${{ matrix.module }}" -am checkstyle:check

      - name: Upload Checkstyle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-${{ matrix.module }}
          path: microservices/${{ matrix.module }}/target/site/checkstyle.html

  snyk-sca:
    name: Security | Snyk SCA (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    defaults:
      run:
        working-directory: microservices/${{ matrix.module }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Scan dependencies with Snyk
        run: snyk test --file=pom.xml --severity-threshold=high

  snyk-sast:
    name: Security | Snyk Code (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    defaults:
      run:
        working-directory: microservices/${{ matrix.module }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Scan source code with Snyk Code
        run: snyk code test --severity-threshold=high

  trivy-image-scan:
    name: Security | Trivy image scan (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: [detect-changes, build-test]
    if: |
      always() &&
      needs.detect-changes.outputs.has_changes == 'true' &&
      needs.build-test.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build service container image
        run: |
          docker build \
            -f Dockerfile \
            --build-arg MODULE="${{ matrix.module }}" \
            -t "flowforge/${{ matrix.module }}:${{ github.sha }}" \
            .

      - name: Generate Trivy vulnerability evidence
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "flowforge/${{ matrix.module }}:${{ github.sha }}"
          format: "json"
          output: "microservices/trivy-${{ matrix.module }}.json"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          vuln-type: "os,library"
          ignore-unfixed: true
          exit-code: "0"

      - name: Enforce Trivy high and critical severity gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "flowforge/${{ matrix.module }}:${{ github.sha }}"
          format: "table"
          severity: "HIGH,CRITICAL"
          vuln-type: "os,library"
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.module }}
          path: microservices/trivy-${{ matrix.module }}.json
          if-no-files-found: warn
          retention-days: 30

  sonar:
    name: Quality | SonarCloud advisory (${{ matrix.module }})
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 for SonarCloud
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: microservices/pom.xml

      - name: Resolve SonarCloud project key
        id: sonar-key
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.module }}" in
            auth-service)
              PROJECT_KEY="flowforge-enterprise-auth-service"
              ;;
            workflow-service)
              PROJECT_KEY="flowforge-enterprise-workflow-service"
              ;;
            notification-audit-service)
              PROJECT_KEY="flowforge-enterprise-notification-audit-service"
              ;;
            ai-assistant-service)
              PROJECT_KEY="flowforge-enterprise-ai-assistant-service"
              ;;
            attachment-service)
              PROJECT_KEY="flowforge-enterprise-attachment-service"
              ;;
            api-gateway)
              PROJECT_KEY="flowforge-enterprise-api-gateway"
              ;;
            platform-security)
              PROJECT_KEY="flowforge-enterprise-platform-security"
              ;;
            *)
              echo "No SonarCloud project key configured for ${{ matrix.module }}."
              exit 1
              ;;
          esac

          echo "project_key=$PROJECT_KEY" >> "$GITHUB_OUTPUT"
          echo "SonarCloud project: $PROJECT_KEY"

      - name: Build and test service
        run: |
          mvn --batch-mode -ntp \
            -pl "${{ matrix.module }}" -am \
            clean install

      - name: Analyze service with SonarCloud
        continue-on-error: true
        run: |
          SONAR_COVERAGE_ARGS=()
          if [[ "${{ matrix.module }}" == "platform-security" || \
                "${{ matrix.module }}" == "api-gateway" ]]; then
            SONAR_COVERAGE_ARGS+=("-Dsonar.coverage.exclusions=**")
          fi

          mvn --batch-mode -ntp \
            -f "${{ matrix.module }}/pom.xml" \
            sonar:sonar \
            -Dsonar.projectKey="${{ steps.sonar-key.outputs.project_key }}" \
            -Dsonar.organization=flowforge-enterprise \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300 \
            -Dsonar.coverage.jacoco.xmlReportPaths="target/site/jacoco/jacoco.xml" \
            "${SONAR_COVERAGE_ARGS[@]}"

  dast-scan:
    name: Security | OWASP ZAP DAST
    runs-on: ubuntu-latest
    needs: [detect-changes, integration-container-evidence]
    # DAST is disabled until an explicit decision is made to run active scans.
    if: ${{ false }}
    env:
      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
      GATEWAY_PORT: "8080"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start services for DAST
        working-directory: microservices
        run: |
          docker compose up -d
          sleep 30

      - name: Wait for API Gateway readiness
        run: |
          for i in {1..24}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${GATEWAY_PORT}" || echo "000")
            echo "[$i/24] HTTP_CODE=$HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "404" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f microservices/docker-compose.yml logs --tail=80
          exit 1

      - name: Configure OWASP ZAP rules
        run: |
          mkdir -p .zap
          cat > .zap/rules.tsv << 'EOF'
          10028	WARN
          10029	WARN
          10033	WARN
          10043	WARN
          10045	WARN
          10046	WARN
          10048	WARN
          10062	WARN
          10099	WARN
          10105	WARN
          EOF

      # ZAP is evidence-only for now (continue-on-error + fail_action=false).
      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: "http://localhost:${{ env.GATEWAY_PORT }}"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -j -I"
          fail_action: false
          allow_issue_writing: false
        continue-on-error: true
        timeout-minutes: 10

      - name: Run OWASP ZAP full scan
        uses: zaproxy/action-full-scan@v0.8.0
        with:
          target: "http://localhost:${{ env.GATEWAY_PORT }}"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -j -m 5"
          fail_action: false
          allow_issue_writing: false
        continue-on-error: true
        timeout-minutes: 15

      - name: Stop DAST services
        if: always()
        working-directory: microservices
        run: docker compose down -v

      - name: Upload OWASP ZAP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-reports
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: warn
          retention-days: 30

  stress-test:
    name: Performance | k6 stress test
    runs-on: ubuntu-latest
    needs: [detect-changes, dast-scan]
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_stress == 'true' &&
      needs.dast-scan.result != 'failure' &&
      needs.dast-scan.result != 'cancelled'
    env:
      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
      GATEWAY_PORT: "8080"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start services for stress testing
        working-directory: microservices
        run: |
          docker compose up -d
          sleep 30

      - name: Wait for API Gateway readiness
        run: |
          for i in {1..24}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${GATEWAY_PORT}" || echo "000")
            echo "[$i/24] HTTP_CODE=$HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "404" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f microservices/docker-compose.yml logs --tail=80
          exit 1

      - name: Run k6 stress test
        run: |
          docker run --rm \
            --network host \
            -v "$PWD/stress-test:/scripts" \
            grafana/k6 run /scripts/stress-test.js

      - name: Stop stress-test services
        if: always()
        working-directory: microservices
        run: docker compose down -v

      - name: Upload k6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-stress-test-results
          path: stress-test/

  trigger-jenkins:
    name: Deployment | Trigger Jenkins
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - validate-compose
      - integration-container-evidence
      - iac-scan
      - build-test
      - lint-check
      - snyk-sca
      - snyk-sast
      - trivy-image-scan
      - sonar
      - dast-scan
      - stress-test
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.detect-changes.outputs.has_changes == 'true' &&
      needs.detect-changes.result == 'success' &&
      needs.validate-compose.result != 'failure' &&
      needs.validate-compose.result != 'cancelled' &&
      needs.integration-container-evidence.result != 'failure' &&
      needs.integration-container-evidence.result != 'cancelled' &&
      needs.iac-scan.result != 'failure' &&
      needs.iac-scan.result != 'cancelled' &&
      needs.build-test.result == 'success' &&
      needs.lint-check.result == 'success' &&
      needs.snyk-sca.result == 'success' &&
      needs.snyk-sast.result == 'success' &&
      needs.trivy-image-scan.result == 'success' &&
      needs.dast-scan.result != 'failure' &&
      needs.dast-scan.result != 'cancelled' &&
      needs.stress-test.result != 'failure' &&
      needs.stress-test.result != 'cancelled'
    env:
      JENKINS_URL: ${{ secrets.JENKINS_URL }}
      JENKINS_USER: ${{ secrets.JENKINS_USER }}
      JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
      CHANGED_MODULES: ${{ needs.detect-changes.outputs.modules }}
      TARGET_ENV: test
    steps:
      - name: Trigger deployments for affected services
        shell: bash
        run: |
          set -euo pipefail

          JENKINS_BASE_URL="${JENKINS_URL%/}"
          COOKIE_JAR="$(mktemp)"
          trap 'rm -f "$COOKIE_JAR"' EXIT
          CRUMB_HEADER=()
          if CRUMB_JSON=$(curl --fail --silent --show-error \
              --user "$JENKINS_USER:$JENKINS_API_TOKEN" \
              --cookie-jar "$COOKIE_JAR" \
              "$JENKINS_BASE_URL/crumbIssuer/api/json"); then
            CRUMB_FIELD=$(jq -r '.crumbRequestField' <<< "$CRUMB_JSON")
            CRUMB_VALUE=$(jq -r '.crumb' <<< "$CRUMB_JSON")
            CRUMB_HEADER=(--header "$CRUMB_FIELD: $CRUMB_VALUE")
          fi

          while IFS= read -r MODULE; do
            if [[ "$MODULE" == "platform-security" ]]; then
              continue
            fi

            echo "Triggering Jenkins deployment for $MODULE"
            curl --fail --silent --show-error \
              --request POST \
              --user "$JENKINS_USER:$JENKINS_API_TOKEN" \
              --cookie "$COOKIE_JAR" \
              "${CRUMB_HEADER[@]}" \
              "$JENKINS_BASE_URL/job/$TARGET_ENV/job/$MODULE/build"
          done < <(jq -r '.[]' <<< "$CHANGED_MODULES")
