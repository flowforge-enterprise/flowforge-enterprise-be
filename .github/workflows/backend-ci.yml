name: Microservices CI

on:
  push:
    branches: ["master"]
    paths:
      - "microservices/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "microservices/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:
    inputs:
      run_dast:
        description: "Run OWASP ZAP DAST scan"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      run_stress:
        description: "Run k6 stress test"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      run_compose_checks: ${{ steps.detect.outputs.run_compose_checks }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Maven modules
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          SERVICES=(
            auth-service
            workflow-service
            notification-audit-service
            ai-assistant-service
            attachment-service
            api-gateway
          )

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          git diff --name-only "$BASE_SHA" HEAD > /tmp/changed-files.txt
          cat /tmp/changed-files.txt

          declare -A SELECTED=()
          COMMON_CHANGED=false
          SECURITY_CHANGED=false
          COMPOSE_CHANGED=false

          while IFS= read -r FILE_PATH; do
            case "$FILE_PATH" in
              microservices/pom.xml|microservices/Dockerfile|.github/workflows/backend-ci.yml)
                COMMON_CHANGED=true
                ;;
              microservices/platform-security/*)
                SECURITY_CHANGED=true
                ;;
              microservices/docker-compose.yml)
                COMPOSE_CHANGED=true
                ;;
            esac

            for SERVICE in "${SERVICES[@]}"; do
              if [[ "$FILE_PATH" == "microservices/$SERVICE/"* ]]; then
                SELECTED["$SERVICE"]=1
              fi
            done
          done < /tmp/changed-files.txt

          if [ "$COMMON_CHANGED" = true ]; then
            for SERVICE in "${SERVICES[@]}"; do
              SELECTED["$SERVICE"]=1
            done
          fi

          if [ "$SECURITY_CHANGED" = true ]; then
            for SERVICE in auth-service workflow-service notification-audit-service ai-assistant-service attachment-service; do
              SELECTED["$SERVICE"]=1
            done
          fi

          MODULES=()
          for SERVICE in "${SERVICES[@]}"; do
            if [ "${SELECTED[$SERVICE]+set}" = "set" ]; then
              MODULES+=("$SERVICE")
            fi
          done

          if [ "${#MODULES[@]}" -eq 0 ]; then
            echo 'modules=[]' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          else
            JSON="["
            for MODULE in "${MODULES[@]}"; do
              JSON="${JSON}\"${MODULE}\","
            done
            JSON="${JSON%,}]"
            echo "modules=$JSON" >> "$GITHUB_OUTPUT"
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          fi

          if [ "$COMPOSE_CHANGED" = true ] || [ "$COMMON_CHANGED" = true ]; then
            echo 'run_compose_checks=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_compose_checks=false' >> "$GITHUB_OUTPUT"
          fi

  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.run_compose_checks == 'true'
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        env:
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
        run: docker compose config --quiet

  build-test:
    name: Build & Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: microservices/pom.xml

      - name: Build and test selected service
        run: mvn --batch-mode -ntp -pl "${{ matrix.module }}" -am clean verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.module }}
          path: |
            microservices/${{ matrix.module }}/target/surefire-reports/
            microservices/${{ matrix.module }}/target/site/jacoco/

  lint-check:
    name: Lint Check (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: microservices/pom.xml

      - name: Run Checkstyle for selected service
        run: mvn --batch-mode -ntp -pl "${{ matrix.module }}" -am checkstyle:checkstyle || true

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-${{ matrix.module }}
          path: microservices/${{ matrix.module }}/target/site/checkstyle.html

  snyk-sca:
    name: Snyk SCA Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk SCA scan
        run: snyk test --all-projects --severity-threshold=high
        continue-on-error: true

  snyk-sast:
    name: Snyk SAST Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk Code scan
        run: snyk code test --severity-threshold=high

      - name: Monitor project in Snyk
        run: snyk monitor --all-projects

  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: [detect-changes, build-test]
    if: needs.detect-changes.outputs.has_changes == 'true'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 for SonarQube Cloud
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: microservices/pom.xml

      - name: Run SonarQube scan
        run: |
          mvn --batch-mode -ntp sonar:sonar \
            -Dsonar.projectKey=flowforge-enterprise-be \
            -Dsonar.organization=flowforge-enterprise \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

  dast-scan:
    name: DAST Security Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_dast == 'true'
    env:
      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
      GATEWAY_PORT: "8080"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start all services via Docker Compose
        working-directory: microservices
        run: |
          docker compose up -d
          sleep 30

      - name: Wait for api-gateway to be ready
        run: |
          for i in {1..24}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${GATEWAY_PORT}" || echo "000")
            echo "[$i/24] HTTP_CODE=$HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "404" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f microservices/docker-compose.yml logs --tail=80
          exit 1

      - name: Create ZAP rules configuration
        run: |
          mkdir -p .zap
          cat > .zap/rules.tsv << 'EOF'
          10028	WARN
          10029	WARN
          10033	WARN
          10043	WARN
          10045	WARN
          10046	WARN
          10048	WARN
          10062	WARN
          10099	WARN
          10105	WARN
          EOF

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: "http://localhost:${{ env.GATEWAY_PORT }}"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -j -I"
          fail_action: false
          allow_issue_writing: false
        continue-on-error: true
        timeout-minutes: 10

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.8.0
        with:
          target: "http://localhost:${{ env.GATEWAY_PORT }}"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -j -m 5"
          fail_action: false
          allow_issue_writing: false
        continue-on-error: true
        timeout-minutes: 15

      - name: Stop all services
        if: always()
        working-directory: microservices
        run: docker compose down -v

      - name: Upload ZAP scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-reports
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: warn
          retention-days: 30

  stress-test:
    name: Stress Test with k6
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_stress == 'true'
    env:
      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
      GATEWAY_PORT: "8080"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start all services via Docker Compose
        working-directory: microservices
        run: |
          docker compose up -d
          sleep 30

      - name: Wait for api-gateway
        run: |
          for i in {1..24}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${GATEWAY_PORT}" || echo "000")
            echo "[$i/24] HTTP_CODE=$HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "404" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f microservices/docker-compose.yml logs --tail=80
          exit 1

      - name: Run k6 stress test
        run: |
          docker run --rm \
            --network host \
            -v "$PWD/stress-test:/scripts" \
            grafana/k6 run /scripts/stress-test.js

      - name: Stop all services
        if: always()
        working-directory: microservices
        run: docker compose down -v

      - name: Upload stress test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-stress-test-results
          path: stress-test/
