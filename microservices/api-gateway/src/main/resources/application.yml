server.port: ${SERVER_PORT:8080}
spring:
  application.name: api-gateway
  cloud.gateway.server.webflux:
    httpclient:
      connect-timeout: 3000
      response-timeout: 10s
    globalcors:
      cors-configurations:
        '[/**]':
          allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
          allowedMethods: "*"
          allowedHeaders: "*"
    routes:
      - id: auth-service
        uri: ${AUTH_SERVICE_URL:http://localhost:8081}
        predicates:
          - Path=/api/auth/**,/api/users/**
        filters:
          - name: CircuitBreaker
            args: { name: authCircuit, fallbackUri: "forward:/fallback/auth" }
      - id: workflow-service
        uri: ${WORKFLOW_SERVICE_URL:http://localhost:8082}
        predicates:
          # Includes the API-key-protected regulatory evidence endpoint used by GitHub Actions.
          - Path=/api/workflows/**,/api/approvals/**,/api/workflow-templates/**,/api/regulatory/**,/internal/regulatory/**
        filters:
          - name: CircuitBreaker
            args: { name: workflowCircuit, fallbackUri: "forward:/fallback/workflow" }
      - id: notification-audit-service
        uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
        predicates:
          - Path=/api/notifications/**,/api/audit-logs/**,/ws/**
        filters:
          - name: CircuitBreaker
            args: { name: notificationCircuit, fallbackUri: "forward:/fallback/notification" }
      - id: ai-assistant-service
        uri: ${AI_SERVICE_URL:http://localhost:8084}
        predicates:
          - Path=/api/ai/**
        filters:
          - name: CircuitBreaker
            args: { name: aiCircuit, fallbackUri: "forward:/fallback/ai" }
      - id: attachment-service
        uri: ${ATTACHMENT_SERVICE_URL:http://localhost:8085}
        predicates:
          - Path=/api/attachments/**
        filters:
          - name: CircuitBreaker
            args: { name: attachmentCircuit, fallbackUri: "forward:/fallback/attachment" }
      - id: auth-docs
        uri: ${AUTH_SERVICE_URL:http://localhost:8081}
        predicates: [ Path=/docs/auth ]
        filters: [ SetPath=/v3/api-docs ]
      - id: workflow-docs
        uri: ${WORKFLOW_SERVICE_URL:http://localhost:8082}
        predicates: [ Path=/docs/workflow ]
        filters: [ SetPath=/v3/api-docs ]
      - id: notification-docs
        uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
        predicates: [ Path=/docs/notification ]
        filters: [ SetPath=/v3/api-docs ]
      - id: ai-docs
        uri: ${AI_SERVICE_URL:http://localhost:8084}
        predicates: [ Path=/docs/ai ]
        filters: [ SetPath=/v3/api-docs ]
      - id: attachment-docs
        uri: ${ATTACHMENT_SERVICE_URL:http://localhost:8085}
        predicates: [ Path=/docs/attachment ]
        filters: [ SetPath=/v3/api-docs ]
management.endpoints.web.exposure.include: health,info,metrics,prometheus,gateway
logging.pattern.console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} correlationId=%X{correlationId:-none} logger=%logger{36} msg=%msg%n"
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth & User
        url: /docs/auth
      - name: Workflow & Approval
        url: /docs/workflow
      - name: Notification & Audit
        url: /docs/notification
      - name: AI Assistant
        url: /docs/ai
      - name: Attachment
        url: /docs/attachment
app:
  jwt-secret: ${APP_JWT_SECRET}
  rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:120}
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
