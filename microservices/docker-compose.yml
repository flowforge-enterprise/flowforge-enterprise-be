services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  auth-service:
    build:
      context: .
      args: { MODULE: auth-service }
    depends_on:
      mysql: { condition: service_healthy }
      notification-audit-service: { condition: service_started }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: auth_user
      DB_PASSWORD: auth_password
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:?DEFAULT_PASSWORD must be set}
      NOTIFICATION_SERVICE_URL: http://notification-audit-service:8083
    ports: ["8081:8081"]

  workflow-service:
    build:
      context: .
      args: { MODULE: workflow-service }
    depends_on:
      mysql: { condition: service_healthy }
      auth-service: { condition: service_started }
      notification-audit-service: { condition: service_started }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/workflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: workflow_user
      DB_PASSWORD: workflow_password
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      AUTH_SERVICE_URL: http://auth-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-audit-service:8083
    ports: ["8082:8082"]

  notification-audit-service:
    build:
      context: .
      args: { MODULE: notification-audit-service }
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/notification_audit_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: audit_user
      DB_PASSWORD: audit_password
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      WORKFLOW_SERVICE_URL: http://workflow-service:8082
    ports: ["8083:8083"]

  ai-assistant-service:
    build:
      context: .
      args: { MODULE: ai-assistant-service }
    depends_on:
      auth-service: { condition: service_started }
      workflow-service: { condition: service_started }
      notification-audit-service: { condition: service_started }
    environment:
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      NOTIFICATION_SERVICE_URL: http://notification-audit-service:8083
      AUTH_HEALTH_URL: http://auth-service:8081/actuator/health
      WORKFLOW_HEALTH_URL: http://workflow-service:8082/actuator/health
      NOTIFICATION_HEALTH_URL: http://notification-audit-service:8083/actuator/health
      AI_PROVIDER_ENABLED: ${AI_PROVIDER_ENABLED:-false}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
    ports: ["8084:8084"]

  attachment-service:
    build:
      context: .
      args: { MODULE: attachment-service }
    depends_on:
      mysql: { condition: service_healthy }
      workflow-service: { condition: service_started }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/attachment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: attachment_user
      DB_PASSWORD: attachment_password
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      WORKFLOW_SERVICE_URL: http://workflow-service:8082
      ATTACHMENT_STORAGE_PATH: /data/attachments
    volumes:
      - attachment_data:/data/attachments
    ports: ["8085:8085"]

  api-gateway:
    build:
      context: .
      args: { MODULE: api-gateway }
    depends_on:
      auth-service: { condition: service_started }
      workflow-service: { condition: service_started }
      notification-audit-service: { condition: service_started }
      ai-assistant-service: { condition: service_started }
      attachment-service: { condition: service_started }
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      WORKFLOW_SERVICE_URL: http://workflow-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-audit-service:8083
      AI_SERVICE_URL: http://ai-assistant-service:8084
      ATTACHMENT_SERVICE_URL: http://attachment-service:8085
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
    ports: ["8080:8080"]

volumes:
  mysql_data:
  attachment_data:
