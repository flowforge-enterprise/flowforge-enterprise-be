server:
  port: 8080

spring:
  application:
    name: workflow-mvp-backend
  datasource:
    url: jdbc:h2:mem:workflow_mvp;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Do NOT hardcode a default secret here. Require APP_JWT_SECRET to be provided in the environment
    # (for local development you can set it in an .env file or pass -DAPP_JWT_SECRET=... for JVM).
    secret: ${APP_JWT_SECRET}
    expiration-seconds: 86400

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/workflow_mvp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:workflow}
    password: ${MYSQL_PASSWORD:workflow}
    driver-class-name: com.mysql.cj.jdbc.Driver
