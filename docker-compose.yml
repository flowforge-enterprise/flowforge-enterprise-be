name: flowforge

services:
  mysql:
    image: mysql:8.4
    container_name: flowforge-mysql
    environment:
      MYSQL_DATABASE: workflow_mvp
      MYSQL_USER: workflow
      MYSQL_PASSWORD: workflow
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  backend:
    image: crpi-vu83mjrcrc7gnl5w.cn-hangzhou.personal.cr.aliyuncs.com/nus_flowforge/flowforge-enterprise-be:latest
    container_name: flowforge-enterprise-be
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_URL: jdbc:mysql://mysql:3306/workflow_mvp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: workflow
      MYSQL_PASSWORD: workflow
      # APP_JWT_SECRET should be provided by the operator (e.g. via an .env file, docker secrets, or CI/CD).
    ports:
      - "8081:8080"
    restart: always

volumes:
  mysql_data: