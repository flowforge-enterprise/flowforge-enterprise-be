services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: workflow_mvp
      MYSQL_USER: workflow
      MYSQL_PASSWORD: workflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_URL: jdbc:mysql://mysql:3306/workflow_mvp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: workflow
      MYSQL_PASSWORD: workflow
      APP_JWT_SECRET: workflow-mvp-demo-secret-key-change-before-production-123456
    ports:
      - "8081:8080"

volumes:
  mysql_data:
